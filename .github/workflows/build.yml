name: Build desktop packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: fighter-windows-x64
            platform: windows
          - os: macos-latest
            artifact: fighter-macos-arm64
            platform: macos
          - os: macos-15-intel
            artifact: fighter-macos-x86_64
            platform: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Fighter --add-data "res;res" fighter.py

      - name: Build macOS app
        if: matrix.platform == 'macos'
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name Fighter --add-data "res:res" fighter.py

      - name: Archive Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Fighter.exe -DestinationPath package.zip

      - name: Archive macOS app
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Fighter.app package.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package.zip
          if-no-files-found: error
          retention-days: 30
